<p style="color:#E0004D;font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:0 0 14px;">
  Dirección de envio
</p>

<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td width="4" style="background-color:#193C6B;border-radius:4px 0 0 4px;width:4px;">&nbsp;</td>
    <td style="background-color:#f9fafb;border-radius:0 8px 8px 0;padding:16px 18px;">
      <p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:#111827;margin:0 0 6px;">
        {{ params.shipping_address.first_name }} {{ params.shipping_address.last_name }}
      </p>
      <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6b7280;margin:0;line-height:1.8;">
        {{ params.shipping_address.street.0 }}<br />
        {{ params.shipping_address.city }}, {{ params.shipping_address.region }}<br />
        {{ params.shipping_address.telephone }}
      </p>
    </td>
  </tr>
</table>
